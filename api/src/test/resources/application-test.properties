# ?? Test profile: stub all infrastructure to avoid real connections ??????????

# Redis ? point at a non-existent host; RedisCacheErrorHandler absorbs errors
spring.data.redis.host=localhost
spring.data.redis.port=6399
spring.data.redis.default-ttl=60
spring.data.redis.caches-ttl.test_cache=60

# Cassandra ? placeholder values so context loads without real cluster
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.keyspace-name=test_keyspace
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.username=test
spring.cassandra.password=test
spring.cassandra.ssl.enabled=false
spring.cassandra.schema-action=none
CASSANDRA_TRUST_STORE=classpath:test-truststore.jks
CASSANDRA_TRUST_STORE_PWD=changeit
CASSANDRA_TRUSTSTORE_TYPE=JKS

# Disable SSL bundle validation in tests
spring.ssl.bundle.jks.cassandra.truststore.location=
spring.ssl.bundle.jks.cassandra.truststore.password=
spring.ssl.bundle.jks.cassandra.truststore.type=JKS

# Suppress banner and devtools noise
spring.main.banner-mode=off
spring.devtools.restart.enabled=false

# Feign ? short timeouts for tests
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=1000

